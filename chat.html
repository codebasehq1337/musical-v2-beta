<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat — musical</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    :root { --bg: #0a0e1a; --bg-raised: #0f1424; --border: #1a2342; --text: #c8d4e8; --text-bright: #e8eef8; --text-muted: #5a6a8a; --accent: #4a7fc9; --accent-hover: #5a90e0; --radius: 4px; --font: 'Inter',-apple-system,sans-serif; --font-mono: 'JetBrains Mono',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); max-width: 1100px; margin: 0 auto; }
    .nav-logo { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--text-bright); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color .15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-user { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); overflow: hidden; }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .container { max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; display: grid; grid-template-columns: 1fr 260px; gap: 32px; }
    h1 { font-size: 32px; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
    h2 { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text-muted); text-transform: lowercase; margin-bottom: 20px; letter-spacing: 0.02em; }
    .muted { color: var(--text-muted); }
    .page-header { padding: 32px 0 24px; grid-column: 1 / -1; }
    .chat-main { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 400px; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
    .chat-message { display: flex; gap: 12px; align-items: flex-start; }
    .chat-message.chat-me { flex-direction: row-reverse; }
    .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); flex-shrink: 0; overflow: hidden; }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-bubble { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; max-width: 80%; }
    .chat-me .chat-bubble { background: rgba(74,127,201,0.1); border-color: rgba(74,127,201,0.2); }
    .chat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .chat-header a { font-weight: 600; font-size: 13px; color: var(--text-bright); text-decoration: none; }
    .chat-header a:hover { color: var(--accent); }
    .chat-time { font-size: 11px; color: var(--text-muted); margin-left: auto; }
    .chat-body { font-size: 14px; line-height: 1.5; word-break: break-word; }
    .chat-form { display: flex; gap: 12px; }
    .chat-form input { flex: 1; padding: 12px 16px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: 14px; outline: none; }
    .chat-form input:focus { border-color: var(--accent); }
    .chat-form button { padding: 12px 24px; }
    .chat-sidebar h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
    .chat-user { display: flex; align-items: center; gap: 10px; padding: 8px 0; text-decoration: none; color: var(--text); transition: color .15s; }
    .chat-user:hover { color: var(--accent); }
    .chat-user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--accent); flex-shrink: 0; overflow: hidden; }
    .chat-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-user span { font-size: 13px; }
    .chat-delete { margin-left: 8px; padding: 2px 6px; font-size: 12px; opacity: 0; transition: opacity .15s; }
    .chat-message:hover .chat-delete { opacity: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; border: 1px solid transparent; text-decoration: none; font-family: var(--font); background: transparent; }
    .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); text-decoration: none; }
    .btn-ghost { color: var(--text-muted); border-color: transparent; }
    .btn-ghost:hover { color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .badge-inline { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; margin-left: 4px; vertical-align: middle; }
    .footer { max-width: 1100px; margin: 0 auto; padding: 32px; border-top: 1px solid var(--border); text-align: center; grid-column: 1 / -1; }
    .footer p { font-size: 13px; color: var(--text-muted); margin: 0 auto; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; font-size: 13px; animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { .nav { padding: 16px 20px; } .container { padding: 32px 20px 60px; grid-template-columns: 1fr; } .chat-main { height: 60vh; } .chat-sidebar { display: none; } }
  </style>
</head>
<body>
  <nav class="nav" id="navbar"></nav>
  <main class="container">
    <div class="page-header"><h1>global chat</h1><p class="muted">talk to everyone online right now.</p></div>
    <div class="chat-main">
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="type a message..." autocomplete="off">
        <button type="submit" class="btn btn-primary">send</button>
      </form>
    </div>
    <aside class="chat-sidebar">
      <div id="chat-users"></div>
    </aside>
  </main>
  <footer class="footer"><p>musical — 2026</p></footer>
  <script src="app.js">APP.renderAnnouncement();
  </script>
  <script>APP.requireAuth(); APP.renderNav(); APP.initChat();APP.renderAnnouncement();
  </script>
</body>
</html>
