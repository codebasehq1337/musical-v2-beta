<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>profile — musical</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Bebas+Neue&family=Creepster&family=Poppins:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@400;500;600;700&family=Space+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --bg: #0a0e1a; --bg-raised: #0f1424; --border: #1a2342; --text: #c8d4e8; --text-bright: #e8eef8; --text-muted: #5a6a8a; --accent: #4a7fc9; --accent-hover: #5a90e0; --radius: 4px; --font: 'Inter',-apple-system,sans-serif; --font-mono: 'JetBrains Mono',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; -webkit-font-smoothing: antialiased; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); max-width: 900px; margin: 0 auto; }
    .nav-logo { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--text-bright); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color .15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-user { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); overflow: hidden; }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 32px 80px; position: relative; z-index: 1; }
    h1 { font-size: 28px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
    h2 { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text-muted); text-transform: lowercase; margin-bottom: 20px; letter-spacing: 0.02em; }
    h3 { font-size: 16px; font-weight: 600; color: var(--text-bright); margin-bottom: 4px; }
    p { margin-bottom: 12px; }
    .muted { color: var(--text-muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; border: 1px solid transparent; text-decoration: none; font-family: var(--font); background: transparent; }
    .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); text-decoration: none; }
    .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .btn-ghost { color: var(--text-muted); border-color: transparent; }
    .btn-ghost:hover { color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .profile-banner { width: 100%; height: 200px; background: linear-gradient(135deg, var(--accent), #2d5a9e); border-radius: var(--radius); margin-bottom: -50px; position: relative; overflow: hidden; }
    .profile-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-top { display: flex; align-items: flex-end; gap: 24px; padding: 0 0 48px; position: relative; z-index: 1; }
    .profile-avatar-large { width: 100px; height: 100px; border-radius: 50%; background: var(--bg-raised); border: 3px solid var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 36px; font-weight: 500; color: var(--accent); flex-shrink: 0; position: relative; overflow: hidden; }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .status-dot { position: absolute; bottom: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--bg); }
    .profile-meta { flex: 1; padding-bottom: 8px; }
    .profile-meta h1 { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .profile-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .badges-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .badge-block { font-size: 11px; padding: 3px 8px; border-radius: var(--radius); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
    .connections { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .connection-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--text-muted); text-decoration: none; transition: all .15s; }
    .connection-badge:hover { text-decoration: none; opacity: 0.8; }
    .connection-badge.spotify { color: #1db954; border-color: rgba(29,185,84,0.3); }
    .connection-badge.lastfm { color: #ff4444; border-color: rgba(255,68,68,0.3); }
    .connection-badge.discord { color: #5865f2; border-color: rgba(88,101,242,0.3); }
    .connection-badge i { margin-right: 4px; }
    .meta-tag { font-size: 12px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); padding: 3px 10px; border-radius: var(--radius); margin-right: 6px; margin-bottom: 6px; display: inline-block; }
    .profile-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 48px; }
    .section { padding: 32px 0; border-top: 1px solid var(--border); }
    .track-list { display: flex; flex-direction: column; }
    .track { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .track:last-child { border-bottom: none; }
    .track-art { width: 40px; height: 40px; border-radius: var(--radius); background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; }
    .track-info h4 { font-size: 14px; font-weight: 500; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { font-size: 13px; color: var(--text-muted); margin: 0; }
    .track-time { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .stat-num { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--text-bright); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: var(--radius); background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-muted); }
    .playlist-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--radius); overflow: hidden; }
    .playlist { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); cursor: pointer; transition: background .15s; }
    .playlist:hover { background: var(--bg-raised); }
    .playlist-emoji { font-size: 18px; }
    .playlist-name { font-size: 14px; color: var(--text); }
    .playlist-count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .friend-list { display: flex; flex-direction: column; gap: 12px; }
    .friend { display: flex; align-items: center; gap: 12px; }
    .friend-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); flex-shrink: 0; text-decoration: none; overflow: hidden; }
    .friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .friend-name { font-size: 14px; font-weight: 500; color: var(--text-bright); text-decoration: none; }
    .friend-name:hover { color: var(--accent); }
    .friend-status { font-size: 12px; color: var(--text-muted); }
    .badge-inline { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; margin-left: 4px; vertical-align: middle; }
    .comments-list { display: flex; flex-direction: column; gap: 16px; }
    .comment { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .comment-author { font-weight: 600; color: var(--text-bright); text-decoration: none; font-size: 14px; }
    .comment-time { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .comment-body { font-size: 14px; color: var(--text); line-height: 1.5; }
    .typing-cursor { animation: blink 1s step-end infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rainbow-shift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
    @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse-scale { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes spotify-bar { 0%, 100% { height: 6px; } 50% { height: 18px; } }
    .biolinks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .biolink-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); text-decoration: none; color: var(--text); transition: all .15s; text-align: center; }
    .biolink-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .biolink-icon { font-size: 24px; }
    .biolink-label { font-size: 14px; font-weight: 500; }
    .biolink-clicks { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .discord-status { font-family: var(--font-mono); }
    #profile-3d-card { transition: transform 0.1s ease-out; transform-style: preserve-3d; }
    .footer { max-width: 900px; margin: 0 auto; padding: 32px; border-top: 1px solid var(--border); text-align: center; }
    .footer p { font-size: 13px; color: var(--text-muted); margin: 0 auto; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; font-size: 13px; animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { .nav { padding: 16px 20px; } .container { padding: 0 20px 60px; } .profile-grid { grid-template-columns: 1fr; } .profile-top { flex-direction: column; align-items: center; text-align: center; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .profile-banner { height: 120px; } }
  </style>
</head>
<body>
  <div id="profile-bg-video"></div>
  <div id="particles-container"></div>
  <div id="welcome-modal-container"></div>
  <nav class="nav" id="navbar"></nav>
  <main class="container" id="profile-3d-card">
    <div class="profile-banner" id="p-banner"></div>
    <div class="profile-top">
      <div class="profile-avatar-large" id="p-avatar">?
        <div class="status-dot online" id="p-status"></div>
      </div>
      <div class="profile-meta">
        <div class="badges-row" id="p-badges"></div>
        <div class="connections" id="p-connections"></div>
        <div id="p-biolinks"></div>
        <h1 id="p-name">...</h1>
        <p id="p-handle" class="muted">...</p>
        <div id="p-meta" style="margin-bottom:8px;"></div>
        <p id="p-bio">...</p>
        <div id="p-music"></div>
        <div id="p-spotify"></div>
        <div class="profile-actions" id="p-actions"></div>
      </div>
    </div>
    <div id="p-divider"></div>
    <div class="profile-grid">
      <div class="profile-main">
        <section class="section"><h2>## recently played</h2><div class="track-list" id="p-tracks"></div></section>
        <section class="section"><h2>## stats</h2><div class="stats-grid" id="p-stats"></div><div class="genre-tags" id="p-genres" style="margin-top: 20px;"></div></section>
        <section class="section" id="p-analytics"></section>
        <section class="section" id="p-comments"></section>
      </div>
      <aside class="profile-side">
        <section class="section"><h2>## playlists</h2><div class="playlist-list" id="p-playlists"></div></section>
        <section class="section" id="friends-section"><h2>## friends</h2><div class="friend-list" id="p-friends"></div></section>
      </aside>
    </div>
  </main>
  <footer class="footer"><p>musical — 2026</p></footer>
  <script src="app.js"></script>
  <script>APP.renderNav(); APP.renderProfilePage(); APP.init3DTilt(); APP.renderWelcomeScreen(); APP.renderAnnouncement();</script>
</body>
</html>
